n-top:24px;padding:16px 18px;background:#f4f4f2;border-left:3px solid #283846;font-size:13px;line-height:1.7}.section-title{font-size:13px;letter-spacing:.08em;color:#777;margin:42px 0 12px}.contents{padding:0}.item{display:block;text-decoration:none;color:#222;padding:18px 16px;border-bottom:1px solid #e7e7e7;position:relative}.item:first-child{border-top:1px solid #e7e7e7}.num{font-size:11px;color:#888;margin-bottom:5px}.item strong{font-size:19px;letter-spacing:-.4px;overflow-wrap:anywhere;word-break:normal}.item .sub{font-size:12px;color:#777;margin-top:4px;padding-right:24px;overflow-wrap:anywhere;word-break:normal}.arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;color:#aaa}@media(max-width:420px){header{padding:0 18px}main{padding:30px 20px 40px}h1{font-size:32px}.nav{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.langs button{padding:9px 10px}.restore{overflow-wrap:anywhere;word-break:normal}}html[lang="zh-CN"] .body,html[lang="ja"] .body,html[lang="zh-CN"] h1,html[lang="ja"] h1,html[lang="zh-CN"] .item,html[lang="ja"] .item{word-break:break-all;overflow-wrap:anywhere}

<script>
const ui = {"zh": {"site": "文贵人宅第", "siteSub": "济州特别自治道民俗文化遗产", "footer": "济州特别自治道民俗文化遗产 · 文贵人宅第"}, "ja": {"site": "文貴人の 家屋", "siteSub": "済州特別自治道民俗文化遺産", "footer": "済州特別自治道民俗文化遺産 · 文貴人の 家屋"}};
const main = {"zh": {"title": "文贵人宅第", "sub": "하가리 문귀인 가옥", "body": "所在地:济州市涯月邑下加路1街2-5 (下加里)\n\n文贵人房屋位于南北长的四边形土地上, 后房朝北, 前房朝南, 并且后房与前房以院子为中心相对着, 大门设置于前房的左侧屋。 进入宅院的方式很独特, 通过很短的门前偶来小路就可通过大门, 但是还得右拐才能进到院子里。 像这种进入方式还存在于村庄的偶来小路与农田之间。 文贵人宅第很好地展示了济州传统的4间屋房子和3间屋房子的建筑特征 同时, 文贵人宅第齐备了院子、 堆放谷垛的地方、 后房的院子、 酱缸台、 厕所、 宅旁田地等生活设施, 因此也很好地展现了济州草房的典型特征。", "section": "宅第导览"}, "ja": {"title": "文貴人の 家屋", "sub": "하가리 문귀인 가옥", "body": "所在地:済州市涯月邑下加路1ギル2-5(下加里)\n\n文貴人(ムン·クィイン)の家屋は、南北に長い四角い敷地に「マダン」(庭)をさんで南側の「アンコリ」 (主屋)と北側の「パッコリ」(別棟)が向かい合っていて、 「ムンガン」(門)は「パッコリ」(別棟)の左側に設けられている。 文貴人の家屋は、 敷地までオルレ(村道らの細い路地)を通り、 家の門をくぐった後もう一度右に折れて庭に入るという珍しい入り方をする。 このような入り方は、 村道と敷地の関係上まれに見られる。 文貴人の家屋を通じて、 済州島の伝統的な3間と4間の直家(すごや)の特徴を知ることができる。 また屋外においても、 「マダン」(庭)、 「ヌルグプ」(脱穀前の物を積んでおく空間)、 「アンドウイ」(主屋の後ろにある庭や畑)、 「チャンハングプ」(味や醤油などの入ったかめを置いておく壇)、 「トンシ」(便所)、 「ウヨン」(菜園)など済州島の草家の特徴を多く備えている", "section": "家屋案内"}};
function setLang(lang) {
  if (!main[lang]) lang = 'zh';
  document.documentElement.lang = (lang === 'zh' ? 'zh-CN' : lang);
  try { localStorage.setItem('hagariLang',lang); } catch (e) {}
  window.updateFloatingLanguage?.(lang);
  document.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('active',x.dataset.l === lang));
  const d=main[lang],u=ui[lang];
  document.getElementById('siteName').textContent=u.site;
  document.getElementById('siteSub').textContent=u.siteSub;
  document.getElementById('title').textContent=d.title;
  document.getElementById('sub').textContent=d.sub;
  document.getElementById('body').textContent=d.body;
  document.getElementById('restore').textContent='';
  document.getElementById('footerText').textContent=u.footer;
}
document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click',() => setLang(b.dataset.l)));
let initialLang = 'zh';
try { initialLang = localStorage.getItem('hagariLang') || 'zh'; } catch (e) {}
setLang(initialLang);
</script></body>
