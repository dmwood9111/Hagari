<style>
   *{box-sizing:border-box}html,body{margin:0}body{font-family:"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;background:#ececec;color:#262626}.shell{max-width:520px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 28px rgba(0,0,0,.12)}header{height:76px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6e6e6;background:#fff;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:16px;letter-spacing:-.4px;min-width:0;overflow-wrap:anywhere}.brand small{display:block;font-size:10px;font-weight:500;color:#777;margin-top:3px}.home{font-size:13px;text-decoration:none;color:#333;border:1px solid #ddd;border-radius:9px;padding:9px 11px}main{padding:38px 28px 48px}.eyebrow{font-size:12px;color:#777;letter-spacing:.08em;margin-bottom:12px}h1{font-size:36px;line-height:1.15;letter-spacing:-1.7px;margin:0;overflow-wrap:anywhere;word-break:normal}.en{font-size:19px;margin-top:9px;overflow-wrap:anywhere;word-break:normal}.asian{font-size:14px;color:#555;margin-top:7px;overflow-wrap:anywhere;word-break:normal}.rule{border:0;border-top:1px solid #bdbdbd;margin:24px 0}.body{font-size:16px;line-height:1.95;word-break:normal;overflow-wrap:anywhere;white-space:pre-line;max-width:100%}.langs{display:flex;gap:6px;margin:28px 0 0;flex-wrap:wrap}.langs button{border:1px solid #ddd;background:#fff;padding:9px 12px;border-radius:9px;font-size:12px;cursor:pointer}.langs .active{background:#283846;color:white;border-color:#283846}.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:42px;padding-top:20px;border-top:1px solid #eee;gap:8px}.nav a{text-decoration:none;color:#555;font-size:12px;min-width:0;overflow-wrap:anywhere;word-break:normal}.nav a:last-child{text-align:right}.nav .list{border:1px solid #ddd;border-radius:9px;padding:9px 12px;color:#222}footer{padding:24px 28px;background:#f4f4f2;border-top:1px solid #e7e7e4;font-size:11px;color:#777;text-align:center}.restore{margin-top:24px;padding:16px 18px;background:#f4f4f2;border-left:3px solid #283846;font-size:13px;line-height:1.7}.section-title{font-size:13px;letter-spacing:.08em;color:#777;margin:42px 0 12px}.contents{padding:0}.item{display:block;text-decoration:none;color:#222;padding:18px 16px;border-bottom:1px solid #e7e7e7;position:relative}.item:first-child{border-top:1px solid #e7e7e7}.num{font-size:11px;color:#888;margin-bottom:5px}.item strong{font-size:19px;letter-spacing:-.4px;overflow-wrap:anywhere;word-break:normal}.item .sub{font-size:12px;color:#777;margin-top:4px;padding-right:24px;overflow-wrap:anywhere;word-break:normal}.arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;color:#aaa}@media(max-width:420px){header{padding:0 18px}main{padding:30px 20px 40px}h1{font-size:32px}.nav{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.langs button{padding:9px 10px}.restore{overflow-wrap:anywhere;word-break:normal}}html[lang="zh-CN"] .body,html[lang="ja"] .body,html[lang="zh-CN"] h1,html[lang="ja"] h1,html[lang="zh-CN"] .item,html[lang="ja"] .item{word-break:break-all;overflow-wrap:anywhere}
  </style>
<style>
   #shared-menu{margin:30px 0 8px;padding-top:22px;border-top:1px solid #e6e6e6}.shared-menu-title{font-size:17px;margin:0 0 15px;font-weight:700}.shared-menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.shared-menu-item{display:flex;align-items:center;gap:10px;padding:13px 12px;border:1px solid #e7e7e7;border-radius:9px;text-decoration:none;color:inherit;background:#fff;min-width:0}.shared-menu-item.current{background:#f4f4f4;border-color:#bbb}.shared-menu-item strong{font-size:14px;overflow-wrap:anywhere;min-width:0}.shared-menu-num{font-size:11px;color:#888;flex-shrink:0}.shared-menu-arrow{margin-left:auto;color:#999;font-size:20px}@media(max-width:420px){.shared-menu-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
<header>
<div class="brand">
<span id="siteName">하가리 문형행 가옥</span>
<small id="siteSub">제주특별자치도 민속문화유산</small>
</div>
</header>
<main>
<div class="eyebrow">제주특별자치도 민속문화유산</div>
<h1 id="title">
</h1>
<div class="en" id="sub">
</div>
<div class="langs"><button data-l="zh" type="button">中文</button><button data-l="ja" type="button">日本語</button></div>

<div class="body" id="body">
</div>
<div class="restore" id="restore" style="display:none">
</div>

</main>

</footer>

</script>

<script>
const ui = {
  "zh": {"site": "文亨行 家屋", "siteSub": "济州特别自治道民俗物质文化遗产", "footer": "济州特别自治道民俗物质文化遗产 · 文亨行 家屋"},
  "ja": {"site": "文亨行 家屋", "siteSub": "済州特別自治道民俗文化遺産", "footer": "済州特別自治道民俗文化遺産 · 文亨行 家屋"}
};
const main = {
  "zh": {"title": "文亨行 家屋", "sub": "하가리 문형행 가옥", "body": "所在地: 济州市涯月邑下加路141-23(下加里)\n\n这所房子连着村口路边，地基为不定形形状，整座宅子由里屋、外房、宅旁地、后院（里屋后方的小院 or 宅地）、草垛（堆放喂牛干草的地方）、牛棚、茅房（厕所、猪舍）组成。\n\n里屋是房主的生活空间，由厨房、地板、里屋、仓房组成。在里屋的对面，有着一间独立的外房，旁边是牛舍。\n\n里间是3间房（厨房-地板-房间），外间是2间房，是里间的柱间没有厨房的结构。屋顶材料是芦苇，外墙用石头（玄武岩）。为了减少大风的危害，屋顶是倾斜的形式，为阻挡强日照和风雨吹入屋内，装上了遮阳板。"},
  "ja": {"title": "文亨行 家屋", "sub": "하가리 문형행 가옥", "body": "所在地: 済州市涯月邑ハガロ141-23(下加里)\n\n本家屋は、村の内側の道に隣接しており、不定形の敷地で母屋、外棟、菜園、母屋の裏側の菜園、牛用の干し草の俵、牛小屋、お手洗い兼豚小屋によって構成されている。\n\n母屋は家主の生活空間で、台所、板の間、奥の間、納屋があり、母屋の向かい側は離れで、外棟が配置されている。その隣に牛小屋が位置している。\n\n母屋は3間(台所ー板の間ー部屋)で、外棟は2間となっており、母屋に似ているが一間の台所のない構造となっている。屋根의 材料は茅で、外壁は玄武岩でつくられている。風による被害を防ぐため、屋根の勾配が緩やかであり、強い日差しと風雨が家の中に入ってくるのを防ぐために庇（ひさし）がついている。"}
};
function setLang(lang) {
  if (!main[lang]) lang = 'zh';
  document.documentElement.lang = (lang === 'zh' ? 'zh-CN' : lang);
  try { localStorage.setItem('hagariLang',lang); } catch (e) {}
  window.updateFloatingLanguage?.(lang);
  document.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('active',x.dataset.l === lang));
  const d=main[lang],u=ui[lang];
  document.getElementById('siteName').textContent=u.site;
  document.getElementById('siteSub').textContent=u.siteSub;
  document.getElementById('title').textContent=d.title;
  document.getElementById('sub').textContent=d.sub;
  document.getElementById('body').textContent=d.body;
  document.getElementById('restore').textContent='';
  document.getElementById('footerText').textContent=u.footer;
}
document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click',() => setLang(b.dataset.l)));
let initialLang = 'zh';
try { initialLang = localStorage.getItem('hagariLang') || 'zh'; } catch (e) {}
setLang(initialLang);
</script></body>
</html>
